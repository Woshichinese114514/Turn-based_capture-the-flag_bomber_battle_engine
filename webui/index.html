<!DOCTYPE html>
<!--
  ============================================================================
  抢旗人 · 回放查看器（Canvas 2D 纯前端单页）
  ----------------------------------------------------------------------------
  设计意图：
    · 纯静态页面，双击本文件（file://）即可使用，不需要任何构建步骤或后端。
    · 不使用 ES module：<script type="module"> 在 file:// 下会被 CORS 拒绝，
      因此全部用经典 <script src>，模块通过 window.QFR 命名空间通信。
    · 不使用任何框架/渲染库：地图与实体全部用 Canvas 2D 手绘（见 js/render.js）。
    · 页面结构 = 顶部信息条 + 中间画布 + 右侧事件日志/信息面板 + 底部进度与控制。
    · 所有动态文本由 JS 用 textContent 写入，HTML 里不放任何用户数据。
  加载顺序有依赖：core → parser → state → render → log → controls → main，
    最后一个 main.js 负责装配与启动。
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抢旗人 · 回放查看器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230072B2'/><path d='M5 3v10' stroke='%23fff' stroke-width='1.6'/><path d='M5 3l6 2.5L5 8z' fill='%23ffe066'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部：标题 + 加载回放 + 回放元信息 -->
<header class="app-header">
  <div class="brand">
    <span class="brand-mark">⚑</span>
    <span class="brand-name">抢旗人 · 回放查看器</span>
  </div>

  <div class="header-meta">
    <span class="meta-item"><span class="meta-key">文件</span><span id="headerFile" class="meta-val">（未加载）</span></span>
    <span class="meta-item"><span class="meta-key">队伍</span><span id="headerTeams" class="meta-val">—</span></span>
    <span class="meta-item"><span class="meta-key">帧数</span><span id="headerTicks" class="meta-val">—</span></span>
  </div>

  <div class="header-actions">
    <input id="fileInput" type="file" accept=".jsonl,.json,.ndjson,.txt,application/json" hidden>
    <button id="btnLoad" type="button" class="btn primary">选择回放文件…</button>
  </div>
</header>

<!-- 提示与错误横幅：规范要求坏行/版本不符/加载失败都必须在界面上可见 -->
<div id="noticeBar" class="notice info" hidden></div>
<div id="errorBanner" class="banner error" hidden></div>
<div id="warningBar" class="banner warn" hidden></div>

<!-- 主体：左画布 + 右面板 -->
<main class="app-main">
  <section id="dropZone" class="stage" aria-label="地图画布（可拖入 .jsonl 回放文件）">
    <!-- 尺寸自适应：canvas 由 CSS 撑满容器，渲染前读取布局尺寸重算格子大小 -->
    <canvas id="canvas" class="board"></canvas>
    <div class="stage-hint">把 <code>.jsonl</code> 回放文件拖到这里，或点右上角「选择回放文件」</div>
    <div class="stage-zoom">
      <button id="btnZoomOut" type="button" class="btn tiny" title="缩小">−</button>
      <button id="btnZoomFit" type="button" class="btn tiny" title="自适应窗口">自适应</button>
      <button id="btnZoomIn" type="button" class="btn tiny" title="放大">＋</button>
    </div>
  </section>

  <aside class="side">
    <div class="side-block">
      <div class="side-title">
        事件日志
        <label class="filter">
          队伍过滤
          <select id="filterSelect" disabled>
            <option value="all">全部队伍</option>
          </select>
        </label>
      </div>
      <!-- 事件日志：每个 tick 重建一次（只在 tick 变化时），文本全部走 textContent -->
      <div id="logList" class="log-list" aria-live="polite"></div>
      <div id="logEmpty" class="log-empty">尚未加载回放</div>
    </div>

    <div class="side-block">
      <div class="side-title">信息面板</div>
      <dl class="info">
        <dt>当前进度</dt><dd id="infoTick">—</dd>
        <dt>回放来源</dt><dd id="infoFile">—</dd>
        <dt>地图尺寸</dt><dd id="infoMap">—</dd>
        <dt>单位</dt><dd id="infoUnits">—</dd>
        <dt>旗</dt><dd id="infoFlags">—</dd>
        <dt>炸弹</dt><dd id="infoBombs">—</dd>
      </dl>
      <div class="side-subtitle">各队分数 / AI</div>
      <div id="scoreBoard" class="score-board"></div>
      <!-- 最终结果：只在播放到末帧时显示，避免中途剧透 -->
      <div id="resultBox" class="result" hidden></div>
    </div>

    <div class="side-block legend">
      <div class="side-title">图例</div>
      <ul class="legend-list">
        <li><i class="sw base"></i>阵营区（队伍色，编码 3+队伍）</li>
        <li><i class="sw wall"></i>墙（阻挡移动/视线/爆炸）</li>
        <li><i class="sw void"></i>虚空（走进去即死）</li>
        <li><i class="sw empty"></i>空地（可通行）</li>
        <li><i class="sw center"></i>中心区虚线（旗刷新范围）</li>
        <li><i class="shape unit"></i>单位（方块，HP 点阵）</li>
        <li><i class="shape flag"></i>旗（三角旗形）</li>
        <li><i class="shape bomb"></i>炸弹（圆形 + 倒计时）</li>
      </ul>
    </div>
  </aside>
</main>

<!-- 底部：进度条 + 播放控制 + 键盘提示 -->
<footer class="app-footer">
  <div class="progress-row">
    <input id="progress" class="progress" type="range" min="0" max="0" value="0" step="1" disabled aria-label="回放进度条">
    <span id="statusText" class="status">未加载回放</span>
  </div>

  <div class="control-row">
    <div class="btn-group">
      <button id="btnFirst" type="button" class="btn" title="首帧（Home）">⏮</button>
      <button id="btnPrev50" type="button" class="btn" title="后退 50 帧">−50</button>
      <button id="btnPrev10" type="button" class="btn" title="后退 10 帧">−10</button>
      <button id="btnPrev1" type="button" class="btn" title="上一帧（←）">◀ 上一步</button>
      <button id="btnPlay" type="button" class="btn play" title="播放/暂停（空格）">▶ 播放</button>
      <button id="btnNext1" type="button" class="btn" title="下一帧（→）">下一步 ▶</button>
      <button id="btnNext10" type="button" class="btn" title="前进 10 帧">+10</button>
      <button id="btnNext50" type="button" class="btn" title="前进 50 帧">+50</button>
      <button id="btnLast" type="button" class="btn" title="末帧（End）">⏭</button>
    </div>

    <div class="btn-group">
      <label class="jump">
        跳到 tick
        <input id="tickInput" type="number" min="1" step="1" class="tick-input" placeholder="tick">
      </label>
      <button id="btnGo" type="button" class="btn">跳转</button>
      <span id="tickTotal" class="tick-total"></span>
    </div>

    <fieldset id="speedButtons" class="speed-group">
      <legend>速度</legend>
      <label><input type="radio" name="speed" value="0.5">0.5x</label>
      <label><input type="radio" name="speed" value="1" checked>1x</label>
      <label><input type="radio" name="speed" value="2">2x</label>
      <label><input type="radio" name="speed" value="4">4x</label>
    </fieldset>

    <div class="btn-group">
      <button id="btnReset" type="button" class="btn">重置到首帧</button>
    </div>

    <div class="kbd-hint">键盘：空格 播放/暂停 · ←/→ 步进 · Home/End 首尾</div>
  </div>
</footer>

<!-- 经典脚本标签（非 ES module）：顺序即依赖顺序，main.js 最后装配 -->
<script src="js/core.js"></script>
<script src="js/parser.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/log.js"></script>
<script src="js/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
